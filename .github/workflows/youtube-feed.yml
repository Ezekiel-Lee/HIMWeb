name: Update YouTube Videos

on:
  schedule:
    - cron: '0 20 * * *'   # 매일 1회 (UTC 20시 = 호주 동부 아침)
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos from RSS
        run: python3 scripts/fetch_youtube.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "Update YouTube videos"
          git push
