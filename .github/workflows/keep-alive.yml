name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Supabase
        run: |
          curl -sS --fail-with-body -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
