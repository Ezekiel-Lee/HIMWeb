<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 — HisCreation iDefend Mission (HiM)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════════════════════
   JD MEDIA MISSION — SHARED STYLES
   ═══════════════════════════════════════════════════════ */
:root{
  --navy:#0F1C2E; --navy2:#1B2D45; --navy3:#243650;
  --gold:#C4913A; --gold2:#D4A84A;
  --cream:#FAF7F2; --warm:#F0EBE0;
  --txt:#1a1a1a; --muted:#6B6054;
  --serif:'Playfair Display','Noto Serif KR',Georgia,serif;
  --sans:'Noto Sans KR',-apple-system,sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:var(--txt);overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:var(--sans)}

/* ── LANGUAGE ── */
span.en,div.en,p.en{display:none}
body.en .ko{display:none} body.en .en{display:block}
body.en span.en{display:inline} body.en span.ko{display:none}

#ls{display:flex;gap:1px;margin-right:18px}
.lo{padding:5px 12px;font-size:11px;font-weight:500;letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.28);background:transparent;
  color:rgba(255,255,255,.5);transition:.2s var(--ease)}
.lo:first-child{border-radius:2px 0 0 2px}
.lo:last-child{border-radius:0 2px 2px 0;border-left:none}
.lo.on{background:var(--gold);border-color:var(--gold);color:#fff}
#topbar.sc .lo{border-color:rgba(15,28,46,.22);color:var(--muted)}
#topbar.sc .lo.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* ── TOPBAR: logo left / lang+burger right ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:70px;display:flex;align-items:center;
  padding:0 32px;transition:.3s var(--ease);
}
#topbar.sc{
  background:rgba(250,247,242,.97);backdrop-filter:blur(10px);
  box-shadow:0 1px 0 rgba(0,0,0,.07);
}
#home-link{display:flex;align-items:center;gap:10px;margin-right:auto}
#home-link img{height:30px;width:auto;transition:.3s}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-main{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;letter-spacing:.03em;transition:.3s}
.logo-sub{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:2px;transition:.3s}
#topbar.sc .logo-main{color:var(--navy)}
#topbar.sc .logo-sub{color:var(--muted)}

#burger{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;flex-shrink:0}
#burger span{position:absolute;left:9px;width:22px;height:2px;background:#fff;border-radius:1px;transition:transform .3s var(--ease),opacity .3s var(--ease),background .3s var(--ease)}
#burger span:nth-child(1){top:14px}
#burger span:nth-child(2){top:19px}
#burger span:nth-child(3){top:24px}
#topbar.sc #burger span{background:var(--navy)}
#burger.open span:nth-child(1){top:19px;transform:rotate(45deg)}
#burger.open span:nth-child(2){opacity:0}
#burger.open span:nth-child(3){top:19px;transform:rotate(-45deg)}
#topbar.sc #burger.open span{background:var(--navy)}

/* ── FULLSCREEN MENU ── */
#menu{
  position:fixed;inset:0;z-index:1900;
  background:rgba(8,14,22,.97);
  opacity:0;pointer-events:none;
  transition:opacity .4s var(--ease);
  display:flex;align-items:center;justify-content:center;
}
#menu.open{opacity:1;pointer-events:all}
#menu-close{position:absolute;top:22px;right:24px;width:40px;height:40px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1901}
#menu-close span{position:absolute;width:22px;height:2px;background:rgba(255,255,255,.6);border-radius:1px;transition:background .2s}
#menu-close span:nth-child(1){transform:rotate(45deg)}
#menu-close span:nth-child(2){transform:rotate(-45deg)}
#menu-close:hover span{background:#D4A84A}
.menu-list{list-style:none;text-align:center}
.menu-list li{overflow:hidden}
.menu-list a{
  display:inline-flex;align-items:baseline;gap:16px;
  font-family:var(--serif);font-size:clamp(26px,5vw,46px);font-weight:400;
  color:rgba(255,255,255,.55);letter-spacing:.03em;
  padding:10px 0;transition:color .25s;
  transform:translateY(100%);
}
#menu.open .menu-list a{transform:translateY(0);transition:transform .5s var(--ease),color .25s}
.menu-list a:hover{color:var(--gold2)}
.menu-num{font-size:13px;color:rgba(196,145,58,.5);letter-spacing:.1em;font-family:var(--sans)}
.menu-list a:hover .menu-num{color:var(--gold)}
.menu-list li:nth-child(1) a{transition-delay:.04s}
.menu-list li:nth-child(2) a{transition-delay:.08s}
.menu-list li:nth-child(3) a{transition-delay:.12s}
.menu-list li:nth-child(4) a{transition-delay:.16s}
.menu-list li:nth-child(5) a{transition-delay:.2s}
.menu-list li:nth-child(6) a{transition-delay:.24s}
.menu-list a.current{color:var(--gold)}

/* ── PAGE HERO (compact, for sub-pages) ── */
.page-hero{
  position:relative;min-height:46vh;display:flex;align-items:center;
  background:var(--navy);overflow:hidden;padding-top:70px;
}
.page-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.32}
.page-hero-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,28,46,.92),rgba(15,28,46,.75))}
.page-hero-content{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:64px 40px;width:100%}
.ph-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);margin-bottom:18px;display:flex;align-items:center;gap:14px}
.ph-eyebrow::before{content:'';width:30px;height:1px;background:var(--gold);display:block}
.ph-title{font-family:var(--serif);font-size:clamp(34px,5vw,64px);font-weight:900;color:#fff;line-height:1.1;letter-spacing:.02em;text-transform:uppercase}
.ph-title em{font-style:italic;font-weight:400;text-transform:none;color:var(--gold2)}
.ph-sub{font-size:14px;color:rgba(255,255,255,.5);max-width:560px;margin-top:18px;line-height:1.9;font-weight:300}
.breadcrumb{font-size:11px;color:rgba(255,255,255,.3);margin-bottom:24px;letter-spacing:.04em}
.breadcrumb a{color:rgba(255,255,255,.5);transition:.2s}
.breadcrumb a:hover{color:var(--gold2)}

/* ── SHARED SECTION HELPERS ── */
section{padding:100px 0}
.w{max-width:1180px;margin:0 auto;padding:0 40px}
.ey{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:14px}
.ey::before{content:'';width:28px;height:1px;background:var(--gold);display:block;flex-shrink:0}
.st{font-family:var(--serif);font-size:clamp(28px,3.8vw,50px);font-weight:700;line-height:1.15;color:var(--navy);margin-bottom:16px;text-transform:uppercase;letter-spacing:.02em}
.st em{font-style:italic;font-weight:400;text-transform:none}
.stw{color:#fff}
.sl{font-size:15px;line-height:2;color:var(--muted);max-width:560px;font-weight:300;margin-bottom:52px}
.slw{color:rgba(255,255,255,.5)}

/* ── FOOTER ── */
footer{background:#0D1A27;padding:48px 40px}
.fi{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.flo{display:flex;align-items:center;gap:10px}
.flo img{height:24px;opacity:.5}
.flo span{font-family:var(--serif);font-size:15px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.04em}
.fli{display:flex;gap:22px;list-style:none;flex-wrap:wrap}
.fli a{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.06em;text-transform:uppercase;transition:.2s}
.fli a:hover{color:var(--gold)}
.fcp{font-size:11px;color:rgba(255,255,255,.14);width:100%;margin-top:10px;letter-spacing:.04em}

/* ── REVEAL ANIMATION ── */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}

/* ── BUTTONS ── */
.bpri{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;background:var(--gold);color:#fff;
  font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:2px;transition:.25s}
.bpri:hover{background:var(--gold2);transform:translateY(-1px)}
.bout{display:inline-flex;align-items:center;gap:10px;padding:13px 32px;background:transparent;color:#fff;
  font-size:12px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:2px;transition:.25s}
.bout:hover{border-color:var(--gold2);color:var(--gold2)}
.bout-dark{display:inline-flex;align-items:center;gap:10px;padding:13px 32px;background:transparent;color:var(--navy);
  font-size:12px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(15,28,46,.25);border-radius:2px;transition:.25s}
.bout-dark:hover{border-color:var(--gold);color:var(--gold)}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  #topbar{padding:0 20px}
  .w{padding:0 22px}
  section{padding:72px 0}
  .page-hero-content{padding:48px 22px}
  footer{padding:36px 22px}
}
@media(prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms !important}
}



body{background:var(--cream)}
#admin-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{background:#fff;border-radius:8px;padding:48px 40px;max-width:380px;width:100%;box-shadow:0 4px 32px rgba(15,28,46,.08);text-align:center}
.gate-box img{height:48px;margin:0 auto 20px}
.gate-box h1{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}
.gate-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.gate-box input{width:100%;padding:13px 16px;border:1px solid rgba(15,28,46,.15);border-radius:4px;font-size:14px;margin-bottom:14px;text-align:center;letter-spacing:.1em}
.gate-box button{width:100%;padding:13px;background:var(--gold);color:#fff;border:none;border-radius:4px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s}
.gate-box button:hover{background:var(--gold2)}
.gate-error{font-size:12px;color:#D85A30;margin-top:12px;display:none}

#admin-dashboard{display:none;min-height:100vh}
.admin-topbar{background:var(--navy);padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.admin-topbar-left{display:flex;align-items:center;gap:14px}
.admin-topbar img{height:28px}
.admin-topbar h1{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff}
.admin-logout{font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;text-decoration:underline}
.admin-body{max-width:1000px;margin:0 auto;padding:40px 32px}

.admin-section{margin-bottom:48px}
.admin-section-title{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.admin-section-title h2{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy)}
.admin-count{font-size:12px;background:var(--gold);color:#fff;padding:3px 11px;border-radius:12px;font-weight:500}

.admin-card{background:#fff;border:1px solid rgba(15,28,46,.1);border-radius:6px;padding:24px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.admin-card-body p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:4px}
.admin-card-title{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:6px}
.admin-card-meta{font-size:11px;color:var(--gold);margin-bottom:10px;letter-spacing:.02em}
.admin-card-actions{display:flex;gap:8px;flex-shrink:0}
.btn-approve,.btn-reject,.btn-edit{padding:9px 18px;border:none;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-approve{background:#639922;color:#fff}
.btn-approve:hover{background:#3B6D11}
.btn-reject{background:#E24B4A;color:#fff}
.btn-reject:hover{background:#A32D2D}
.btn-edit{background:#4A6FA5;color:#fff}
.btn-edit:hover{background:#35507D}
.btn-cancel-edit{background:#8a8a8a;color:#fff}
.btn-cancel-edit:hover{background:#6b6b6b}
.btn-approve:disabled,.btn-reject:disabled,.btn-edit:disabled{opacity:.5;cursor:not-allowed}
.edit-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.edit-field input,.edit-field textarea{width:100%;padding:9px 10px;border:1px solid rgba(15,28,46,.15);border-radius:4px;font-size:13px;font-family:var(--sans);margin-bottom:12px}
.edit-field textarea{resize:vertical}
.edit-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.admin-empty{font-size:13px;color:var(--muted);padding:32px;text-align:center;background:#fff;border-radius:6px;border:1px dashed rgba(15,28,46,.15)}
.notice-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:rgba(196,145,58,.12);color:var(--gold);padding:3px 9px;border-radius:10px;margin-left:8px}

/* ── 예약 달력 (관리자용, 크고 명확하게) ── */
.cal-box{background:#fff;border:1px solid rgba(15,28,46,.1);border-radius:6px;padding:24px;margin-bottom:16px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav{padding:10px 18px;background:var(--cream);border:1px solid rgba(15,28,46,.12);border-radius:4px;font-size:14px;font-weight:500;color:var(--navy);cursor:pointer}
.cal-nav:hover{background:#fff;border-color:var(--gold)}
.cal-month-label{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy)}
.cal-legend{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:18px;font-size:13px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:7px}
.cal-dot{width:14px;height:14px;border-radius:3px;display:inline-block}
.cal-dot-pending{background:#F4D58D}
.cal-dot-confirmed{background:#E29B9B}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:13px;color:var(--muted);font-weight:500;padding:8px 0}
.cal-day{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 4px;font-size:16px;font-weight:600;border-radius:5px;color:var(--txt);background:#fff;border:1px solid rgba(15,28,46,.08)}
.cal-day.cal-empty{border:none;background:transparent}
.cal-day.cal-pending{background:#F4D58D;color:#6B5417;border-color:transparent}
.cal-day.cal-confirmed{background:#E29B9B;color:#6B1F1F;border-color:transparent}
.cal-day-name{font-size:10px;font-weight:400;margin-top:3px;line-height:1.3;text-align:center;word-break:break-all}

@media(max-width:640px){
  .admin-card{grid-template-columns:1fr}
  .admin-card-actions{justify-content:flex-end}
  .admin-body{padding:28px 18px}
  .cal-day{min-height:44px;font-size:13px}
}

</style>
</head>

  </div>
</div>

<script>

/* ═══════════════════════════════════════════════════════
   JD MEDIA MISSION — SHARED SCRIPT
   ═══════════════════════════════════════════════════════ */

/* Language toggle */
function sl(l){
  document.body.className = (document.body.className || '').replace(/\s*(ko|en)\s*/g, ' ').trim();
  document.body.classList.add(l);
  var ko = document.getElementById('lko');
  var en = document.getElementById('len');
  if (ko) ko.classList.toggle('on', l === 'ko');
  if (en) en.classList.toggle('on', l === 'en');
  document.documentElement.lang = l;
  localStorage.setItem('jdl', l);
}
(function(){
  var s = localStorage.getItem('jdl');
  if (s) sl(s);
})();

/* Topbar scroll state (only relevant on pages that scroll) */
window.addEventListener('scroll', function(){
  var nav = document.getElementById('topbar');
  if (nav) nav.classList.toggle('sc', window.scrollY > 50);
}, { passive: true });

/* Fullscreen menu toggle */
function toggleMenu(){
  var m = document.getElementById('menu');
  var b = document.getElementById('burger');
  if (m) m.classList.toggle('open');
  if (b) b.classList.toggle('open');
}

/* Close menu on link click (mobile convenience) */
document.addEventListener('DOMContentLoaded', function(){
  var menu = document.getElementById('menu');
  if (menu) {
    menu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        // allow navigation; no need to prevent
      });
    });
  }
});

/* Scroll reveal */
var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.1 });
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.rv').forEach(function(el){ io.observe(el); });
});

/* Generic tab switcher: usage <button class="tab" onclick="switchTab(this,'panelId','.tabGroupSelector')"> */
function switchTab(btn, id, groupSel){
  var scope = groupSel ? document.querySelector(groupSel) : document;
  scope.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
  scope.querySelectorAll('.tpanel').forEach(function(p){ p.classList.remove('on'); });
  btn.classList.add('on');
  document.getElementById(id).classList.add('on');
}

function escapeHtmlAdmin(str){

  var div = document.createElement('div');
  div.textContent = str;

/* input value=""/textarea 안에 안전하게 넣기 위한 이스케이프 (줄바꿈은 유지) */
function escapeAttr(str){
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── 예약 달력 (전체 pending + confirmed 표시) ── */
var calBookings = [];
var calViewDate = new Date(); calViewDate.setDate(1);
var CAL_DOW_KO = ['일','월','화','수','목','금','토'];

function calChangeMonth(delta){
  calViewDate.setMonth(calViewDate.getMonth() + delta);
  renderCalendarGrid();
}

function calEntriesForDate(y, m, d){
  var target = new Date(y, m, d);
  target.setHours(0,0,0,0);
  return calBookings.filter(function(b){
    var s = new Date(b.start_date + 'T00:00:00');
    var e = new Date(b.end_date + 'T00:00:00');
    return target >= s && target <= e;
  });
}

function renderCalendarGrid(){
  var grid = document.getElementById('cal-grid');
  var label = document.getElementById('cal-month-label');
  if (!grid) return;

  var y = calViewDate.getFullYear();
  var m = calViewDate.getMonth();
  label.textContent = y + '년 ' + (m + 1) + '월';

  var html = CAL_DOW_KO.map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
  var firstDow = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();

  for (var i = 0; i < firstDow; i++){
    html += '<div class="cal-day cal-empty"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++){
    var entries = calEntriesForDate(y, m, d);
    var status = '';
    var nameTag = '';
    if (entries.length){
      var hasConfirmed = entries.some(function(b){ return b.status === 'confirmed'; });
      status = hasConfirmed ? ' cal-confirmed' : ' cal-pending';
      nameTag = '<span class="cal-day-name">' + escapeHtmlAdmin(entries[0].requester_name || '') + '</span>';
    }
    html += '<div class="cal-day' + status + '">' + d + nameTag + '</div>';
  }
  grid.innerHTML = html;
}

  var note = document.getElementById('edit-bk-note-' + id).value;

  if (!title.trim() || !name.trim()){
    alert('프로그램과 이름은 비워둘 수 없습니다.');
    return;
  }
  if (new Date(endDate) < new Date(startDate)){
    alert('종료일은 시작일과 같거나 이후여야 합니다.');
    return;
  }

  sb.from('bookings').update({
    title: title, requester_name: name, email: email || null, phone: phone || null,
    start_date: startDate, end_date: endDate, note: note || null
  }).eq('id', id)
  .then(function(res){
    if (res.error){ alert('오류: ' + res.error.message); return; }
    loadConfirmedBookings();
    loadCalendarBookings();
  });
}

function deleteConfirmedBooking(id, btn){
  if (!confirm('해당 예약을 삭제하시겠습니까?')) return;
  setCardLoading(btn, true);
  sb.from('bookings').delete().eq('id', id)
  .then(function(res){
    if (!res.error){ btn.closest('.admin-card').remove(); loadCalendarBookings(); }
    else alert('오류: ' + res.error.message);
  })
  .finally(function(){ updateCountsAfterRemoval('confirmed-bookings-count'); });
}

var COUNT_LIST_MAP = {
  'posts-count': { listId: 'pending-posts-list', emptyText: '대기 중인 게시글이 없습니다.' },
  'published-posts-count': { listId: 'published-posts-list', emptyText: '게시된 글이 없습니다.' },
  'bookings-count': { listId: 'pending-bookings-list', emptyText: '대기 중인 교육 신청이 없습니다.' },
  'confirmed-bookings-count': { listId: 'confirmed-bookings-list', emptyText: '확정된 예약이 없습니다.' }
};

function updateCountsAfterRemoval(countId){
  var section = document.getElementById(countId).closest('.admin-section');
  var remaining = section.querySelectorAll('.admin-card').length;
  document.getElementById(countId).textContent = remaining;
  if (remaining === 0){
    var info = COUNT_LIST_MAP[countId];
    if (!info) return;
    setTimeout(function(){
      if (document.querySelectorAll('#' + info.listId + ' .admin-card').length === 0){
        document.getElementById(info.listId).innerHTML = '<p class="admin-empty">' + info.emptyText + '</p>';
      }
    }, 350);
  }
}

/* Supabase 로그인 세션이 남아있으면 자동으로 대시보드로 이동 */
(function(){
  if (!sb) return;
  sb.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if (!session) return;
    sb.rpc('am_i_admin').then(function(r){
      if (r.data) showDashboard();
    });
  });
})();
</script>
