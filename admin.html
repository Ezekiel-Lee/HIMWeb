/* ═══════════════════════════════════════════════════════
   JD MEDIA MISSION — SHARED SCRIPT
   ═══════════════════════════════════════════════════════ */

/* Language toggle */
function sl(l){
  document.body.className = (document.body.className || '').replace(/\s*(ko|en)\s*/g, ' ').trim();
  document.body.classList.add(l);
  var ko = document.getElementById('lko');
  var en = document.getElementById('len');
  if (ko) ko.classList.toggle('on', l === 'ko');
  if (en) en.classList.toggle('on', l === 'en');
  document.documentElement.lang = l;
  localStorage.setItem('jdl', l);
}
(function(){
  var s = localStorage.getItem('jdl');
  if (s) sl(s);
})();

/* Topbar scroll state (only relevant on pages that scroll) */
window.addEventListener('scroll', function(){
  var nav = document.getElementById('topbar');
  if (nav) nav.classList.toggle('sc', window.scrollY > 50);
}, { passive: true });

/* Fullscreen menu toggle */
function toggleMenu(){
  var m = document.getElementById('menu');
  var b = document.getElementById('burger');
  if (m) m.classList.toggle('open');
  if (b) b.classList.toggle('open');
}

/* Close menu on link click (mobile convenience) */
document.addEventListener('DOMContentLoaded', function(){
  var menu = document.getElementById('menu');
  if (menu) {
    menu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        // allow navigation; no need to prevent
      });
    });
  }
});

/* Scroll reveal */
var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.1 });
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.rv').forEach(function(el){ io.observe(el); });
});

/* Generic tab switcher: usage <button class="tab" onclick="switchTab(this,'panelId','.tabGroupSelector')"> */
function switchTab(btn, id, groupSel){
  var scope = groupSel ? document.querySelector(groupSel) : document;
  scope.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
  scope.querySelectorAll('.tpanel').forEach(function(p){ p.classList.remove('on'); });
  btn.classList.add('on');
  document.getElementById(id).classList.add('on');
}


</script>

   (게시글 승인은 더 이상 이 값을 쓰지 않습니다) */
function getAdminPw(){
  return ADMIN_PASSWORD;
}

function escapeHtmlAdmin(str){
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML.replace(/\n/g, '<br>');
}

function loadPending(){
  loadPendingPosts();
  loadPublishedPosts();
  loadPendingBookings();
}

function loadPendingPosts(){
  if (!sb){
    document.getElementById('pending-posts-list').innerHTML = '<p class="admin-empty">⚠ SUPABASE_URL이 아직 설정되지 않았습니다.</p>';
    return;
  }
  sb.from('posts').select('*').eq('status', 'pending').order('created_at', { ascending: false })
    .then(function(res){
      if (res.error){
        alert('인증 오류: ' + res.error.message);
        doLogout();
        return;
      }
      renderPendingPosts(res.data || []);
    })
    .catch(function(){
      document.getElementById('pending-posts-list').innerHTML = '<p class="admin-empty">불러오기 실패. 네트워크를 확인해 주세요.</p>';
    });
}

function loadPublishedPosts(){
  if (!sb){
    document.getElementById('published-posts-list').innerHTML = '<p class="admin-empty">⚠ SUPABASE_URL이 아직 설정되지 않았습니다.</p>';
    return;
  }
  sb.from('posts').select('*').eq('status', 'approved').order('created_at', { ascending: false })
    .then(function(res){
      if (res.error){
        alert('인증 오류: ' + res.error.message);
        doLogout();
        return;
      }
      renderPublishedPosts(res.data || []);
    })
    .catch(function(){
      document.getElementById('published-posts-list').innerHTML = '<p class="admin-empty">불러오기 실패. 네트워크를 확인해 주세요.</p>';
    });
}

function loadPendingBookings(){
  if (SCRIPT_URL.indexOf('YOUR_APPS_SCRIPT') === 0){
    document.getElementById('pending-bookings-list').innerHTML = '<p class="admin-empty">⚠ SCRIPT_URL이 아직 설정되지 않았습니다.</p>';
    return;
  }

  fetch(SCRIPT_URL + '?action=adminPending&password=' + encodeURIComponent(getAdminPw()))
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (!data.ok){
        alert('인증 오류: ' + (data.error || '알 수 없는 오류'));
        return;
      }
      renderPendingBookings(data.pendingBookings || []);
    })
    .catch(function(){
      document.getElementById('pending-bookings-list').innerHTML = '<p class="admin-empty">불러오기 실패. 네트워크를 확인해 주세요.</p>';
    });
}

function renderPendingPosts(posts){
  document.getElementById('posts-count').textContent = posts.length;
  var listEl = document.getElementById('pending-posts-list');

  if (posts.length === 0){
    listEl.innerHTML = '<p class="admin-empty">대기 중인 게시글이 없습니다.</p>';
    return;
  }

  listEl.innerHTML = posts.map(function(post){
    var date = new Date(post.created_at);
    var dateStr = date.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    var images = (post.image_urls && post.image_urls.length)
      ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
          post.image_urls.map(function(u){ return '<img src="' + u + '" style="width:64px;height:64px;object-fit:cover;border-radius:4px">'; }).join('') +
        '</div>'
      : '';
    return '' +
    '<div class="admin-card" data-id="' + post.id + '">' +
      '<div class="admin-card-body">' +
        '<p class="admin-card-meta">' + escapeHtmlAdmin(post.category || '일반') + ' · ' + dateStr + ' · ' + escapeHtmlAdmin(post.name || '익명') + '</p>' +
        '<p class="admin-card-title">' + escapeHtmlAdmin(post.title) + '</p>' +
        '<p>' + escapeHtmlAdmin(post.content) + '</p>' +
        (post.youtube_url ? '<p style="color:var(--gold);margin-top:6px">▶ ' + escapeHtmlAdmin(post.youtube_url) + '</p>' : '') +
        images +
      '</div>' +
      '<div class="admin-card-actions">' +
        '<button class="btn-approve" onclick="approvePost(\'' + post.id + '\', this)">승인</button>' +
        '<button class="btn-reject" onclick="rejectPost(\'' + post.id + '\', this)">거절</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderPublishedPosts(posts){
  document.getElementById('published-posts-count').textContent = posts.length;
  var listEl = document.getElementById('published-posts-list');

  if (posts.length === 0){
    listEl.innerHTML = '<p class="admin-empty">게시된 글이 없습니다.</p>';
    return;
  }

  listEl.innerHTML = posts.map(function(post){
    var date = new Date(post.created_at);
    var dateStr = date.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    var images = (post.image_urls && post.image_urls.length)
      ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
          post.image_urls.map(function(u){ return '<img src="' + u + '" style="width:64px;height:64px;object-fit:cover;border-radius:4px">'; }).join('') +
        '</div>'
      : '';
    var noticeFlag = post.is_notice ? '<span class="notice-flag">📌 공지</span>' : '';
    return '' +
    '<div class="admin-card" data-id="' + post.id + '">' +
      '<div class="admin-card-body">' +
        '<p class="admin-card-meta">' + escapeHtmlAdmin(post.category || '일반') + ' · ' + dateStr + ' · ' + escapeHtmlAdmin(post.name || '익명') + noticeFlag + '</p>' +
        '<p class="admin-card-title">' + escapeHtmlAdmin(post.title) + '</p>' +
        '<p>' + escapeHtmlAdmin(post.content) + '</p>' +
        (post.youtube_url ? '<p style="color:var(--gold);margin-top:6px">▶ ' + escapeHtmlAdmin(post.youtube_url) + '</p>' : '') +
        images +
      '</div>' +
      '<div class="admin-card-actions">' +
        '<button class="btn-reject" onclick="deletePublishedPost(\'' + post.id + '\', this)">삭제</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function deletePublishedPost(id, btn){
  if (!confirm('이미 게시된 글입니다. 정말 삭제하시겠습니까?')) return;
  setCardLoading(btn, true);
  sb.from('posts').delete().eq('id', id)
  .then(function(res){
    if (!res.error) btn.closest('.admin-card').remove();
    else alert('오류: ' + res.error.message);
  })
  .finally(function(){ updateCountsAfterRemoval('published-posts-count'); });
}

function renderPendingBookings(bookings){
  document.getElementById('bookings-count').textContent = bookings.length;
  var listEl = document.getElementById('pending-bookings-list');

  if (bookings.length === 0){
    listEl.innerHTML = '<p class="admin-empty">대기 중인 교육 신청이 없습니다.</p>';
    return;
  }

  listEl.innerHTML = bookings.map(function(b){
    var date = new Date(b.date);
    var dateStr = date.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
    var rangeStr = dateStr;
    if (b.endDate){
      var endDateObj = new Date(b.endDate);
      /* 종일 이벤트는 종료일이 다음날 0시로 저장되므로 하루 빼서 실제 마지막 날짜로 표시 */
      endDateObj.setDate(endDateObj.getDate() - 1);
      var endDateStr = endDateObj.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
      if (endDateStr !== dateStr) rangeStr = dateStr + ' ~ ' + endDateStr;
    }
    var desc = (b.description || '').split('\\n').map(escapeHtmlAdmin).join('<br>');
    return '' +
    '<div class="admin-card" data-event-id="' + b.eventId + '">' +
      '<div class="admin-card-body">' +
        '<p class="admin-card-meta">신청 기간: ' + rangeStr + '</p>' +
        '<p class="admin-card-title">' + escapeHtmlAdmin(b.title.replace('[승인대기] ', '')) + '</p>' +
        '<p style="line-height:1.9">' + desc + '</p>' +
      '</div>' +
      '<div class="admin-card-actions">' +
        '<button class="btn-approve" onclick="approveBooking(\'' + b.eventId + '\', this)">확정</button>' +
        '<button class="btn-reject" onclick="rejectBooking(\'' + b.eventId + '\', this)">거절</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function setCardLoading(btn, loading){
  var card = btn.closest('.admin-card');
  card.querySelectorAll('button').forEach(function(b){ b.disabled = loading; });
}

function approvePost(id, btn){
  setCardLoading(btn, true);
  sb.from('posts').update({ status: 'approved' }).eq('id', id)
  .then(function(res){
    if (!res.error) btn.closest('.admin-card').remove();
    else alert('오류: ' + res.error.message);
  })
  .finally(function(){ updateCountsAfterRemoval('posts-count'); });
}

function rejectPost(id, btn){
  if (!confirm('이 게시글을 삭제하시겠습니까?')) return;
  setCardLoading(btn, true);
  sb.from('posts').delete().eq('id', id)
  .then(function(res){
    if (!res.error) btn.closest('.admin-card').remove();
    else alert('오류: ' + res.error.message);
  })
  .finally(function(){ updateCountsAfterRemoval('posts-count'); });
}

function approveBooking(eventId, btn){
  setCardLoading(btn, true);
  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'approveBooking', eventId: eventId, password: getAdminPw() })
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (data.ok) btn.closest('.admin-card').remove();
    else alert('오류: ' + data.error);
  })
  .finally(function(){ updateCountsAfterRemoval('bookings-count'); });
}

function rejectBooking(eventId, btn){
  if (!confirm('이 신청을 거절하시겠습니까? 해당 날짜는 다시 신청 가능해집니다.')) return;
  setCardLoading(btn, true);
  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'rejectBooking', eventId: eventId, password: getAdminPw() })
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (data.ok) btn.closest('.admin-card').remove();
    else alert('오류: ' + data.error);
  })
  .finally(function(){ updateCountsAfterRemoval('bookings-count'); });
}

var COUNT_LIST_MAP = {
  'posts-count': { listId: 'pending-posts-list', emptyText: '대기 중인 게시글이 없습니다.' },
  'published-posts-count': { listId: 'published-posts-list', emptyText: '게시된 글이 없습니다.' },
  'bookings-count': { listId: 'pending-bookings-list', emptyText: '대기 중인 교육 신청이 없습니다.' }
};

function updateCountsAfterRemoval(countId){
  var section = document.getElementById(countId).closest('.admin-section');
  var remaining = section.querySelectorAll('.admin-card').length;
  document.getElementById(countId).textContent = remaining;
  if (remaining === 0){
    var info = COUNT_LIST_MAP[countId];
    if (!info) return;
    setTimeout(function(){
      if (document.querySelectorAll('#' + info.listId + ' .admin-card').length === 0){
        document.getElementById(info.listId).innerHTML = '<p class="admin-empty">' + info.emptyText + '</p>';
      }
    }, 350);
  }
}

/* Supabase 로그인 세션이 남아있으면 자동으로 대시보드로 이동 */
(function(){
  if (!sb) return;
  sb.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if (!session) return;
    sb.rpc('am_i_admin').then(function(r){
      if (r.data) showDashboard();
    });
  });
})();
</script>
